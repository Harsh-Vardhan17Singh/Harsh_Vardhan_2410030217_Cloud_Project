---
# PRIMARY CLUSTER CONFIGURATION (Simulated On-Premises Data Center)
apiVersion: v1
kind: ConfigMap
metadata:
  name: visitor-counter-config
  labels:
    app: visitor-counter
    environment: on-premises
data:
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  CLUSTER_NAME: "Primary-Cluster (On-Premises Data Center)"
  APP_ENV: "production-primary"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visitor-counter
      tier: database
  template:
    metadata:
      labels:
        app: visitor-counter
        tier: database
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          volumeMounts:
            - name: redis-storage
              mountPath: /data
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: visitor-counter
    tier: database

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visitor-counter-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visitor-counter
      tier: frontend
  template:
    metadata:
      labels:
        app: visitor-counter
        tier: frontend
    spec:
      containers:
        - name: web
          image: visitor-counter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: visitor-counter-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: visitor-counter-service
spec:
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30005
  selector:
    app: visitor-counter
    tier: frontend

