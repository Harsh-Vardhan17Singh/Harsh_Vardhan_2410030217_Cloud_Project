events { worker_connections 1024; }

http {
    # Upstream definition for Primary (On-Prem) and Secondary (Cloud)
    # The 'backup' directive instructs Nginx to only route to Secondary when Primary is down
    upstream visitor_backend {
        server 127.0.0.1:30005 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:30006 backup;
    }

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://visitor_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Health check timeout
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            
            # Add failover header to observe response origin
            add_header X-Upstream-Server $upstream_addr always;
        }

        # Status endpoint for monitoring
        location /hybrid-status {
            return 200 '{"status": "active", "mode": "hybrid-failover"}\n';
            add_header Content-Type application/json;
        }
    }
}

